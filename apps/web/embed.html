<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Syncanvas board</title>
  </head>
  <body>
    <canvas id="board" aria-label="Board"></canvas>
    <img id="picture" alt="The board, as it was last saved" hidden />
    <p id="caption" hidden>Busy, retrying…</p>
    <p id="message" hidden></p>
    <a id="badge" href="/" target="_blank" rel="noopener" aria-label="Made with Syncanvas">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="4" y="4" width="17" height="17" rx="4" />
        <rect x="11" y="11" width="17" height="17" rx="4" opacity="0.45" />
      </svg>
      Syncanvas
    </a>
    <script type="module" src="/src/embed/main.ts"></script>
  </body>
</html>
