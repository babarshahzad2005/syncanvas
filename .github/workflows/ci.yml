name: CI

# Every pull request: lint, types, unit/integration tests, then the browser tests against
# `pnpm dev` on a temporary Neon branch, split across three machines that share it. Every push to main: the same checks, then migrate
# the production database (Neon main) and deploy to Cloudflare. (TECH_STACK §10, ticket 10.)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e-db:
    name: Browser test database
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A throwaway copy of the dev branch for this PR; deleted by pr-cleanup.yml when the PR closes.
      - name: Create Neon branch for this PR
        id: db
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: dev
          branch_name: pr-${{ github.event.number }}

      - name: Apply migrations to the PR branch
        run: pnpm --filter @syncanvas/worker db:migrate
        env:
          DATABASE_URL: ${{ steps.db.outputs.db_url }}

  e2e:
    name: Browser tests (${{ matrix.shard }}/3)
    if: github.event_name == 'pull_request'
    needs: [checks, e2e-db]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The branch e2e-db made: the action returns an existing branch instead of creating one.
      # (A job output can't carry the connection string, so each shard asks for it.)
      - name: Connect to the PR's Neon branch
        id: db
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: dev
          branch_name: pr-${{ github.event.number }}

      - name: Local secrets for the dev server (generated per run, never stored)
        run: |
          echo "CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=${{ steps.db.outputs.db_url }}" > apps/web/.env
          cp apps/worker/.dev.vars.example apps/worker/.dev.vars
          pnpm --filter @syncanvas/worker gen:secret
          pnpm --filter @syncanvas/worker gen:keys

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Migrate and deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations to production (Neon main)
        run: pnpm --filter @syncanvas/worker db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Build and deploy to Cloudflare
        run: pnpm release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # The Vite plugin reads the Hyperdrive binding at build time; production uses the real config id.
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://unused:unused@127.0.0.1:5/unused
